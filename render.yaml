services:
  - type: web
    name: thenewsdesk
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "false"
      - key: DO_SPACES_KEY
        sync: false
      - key: DO_SPACES_SECRET
        sync: false
      - key: DO_SPACES_REGION
        sync: false
      - key: DO_SPACES_BUCKET
        sync: false
      - key: DO_SPACES_ENDPOINT
        sync: false
      - key: DO_SPACES_CDN
        sync: false
